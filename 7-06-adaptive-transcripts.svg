<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1110" viewBox="0 0 1120 1110"><rect width="1120" height="1110" fill="#f4efec"/><rect x="16" y="16" width="1088" height="1078" rx="22" fill="white"/><g font-family="Arial,sans-serif">
<metadata id="full-adaptive-report" data-encoding="zlib-base64-json"></metadata>
<text x="48" y="62" font-size="30" fill="#251f21" font-weight="600" >PrivacyLab / adaptation needs conditional laws</text>
<text x="48" y="96" font-size="18" fill="#585254" font-weight="400" >Unfold every transcript. Keep every killed-mass witness. Do not compose marginals.</text>
<text x="48" y="139" font-size="21" fill="#251f21" font-weight="600" >1  Actual loss and three valid, sometimes loose, upper bounds</text>
<text x="58" y="182" font-size="16" fill="#585254" font-weight="400" >Developed tree</text>
<text x="485" y="182" font-size="16" fill="#585254" font-weight="400" >Factor T</text>
<text x="610" y="182" font-size="16" fill="#585254" font-weight="400" >Actual</text>
<text x="745" y="182" font-size="16" fill="#585254" font-weight="400" >Clipped</text>
<text x="875" y="182" font-size="16" fill="#585254" font-weight="400" >Uniform</text>
<text x="995" y="182" font-size="16" fill="#585254" font-weight="400" >Additive</text>
<text x="58" y="224" font-size="17" fill="#251f21" font-weight="400" >Independent pure RR</text>
<text x="485" y="224" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-0-0">9</text>
<text x="610" y="224" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-0-1">0</text>
<text x="745" y="224" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-0-2">0</text>
<text x="875" y="224" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-0-3">0</text>
<text x="995" y="224" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-0-4">0</text>
<text x="58" y="268" font-size="17" fill="#251f21" font-weight="400" >Adaptive RR or constant</text>
<text x="485" y="268" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-1-0">3</text>
<text x="610" y="268" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-1-1">3/8</text>
<text x="745" y="268" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-1-2">1/2</text>
<text x="875" y="268" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-1-3">1/2</text>
<text x="995" y="268" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-1-4">1/2</text>
<text x="58" y="312" font-size="17" fill="#251f21" font-weight="400" >Independent at factor one</text>
<text x="485" y="312" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-2-0">1</text>
<text x="610" y="312" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-2-1">1/2</text>
<text x="745" y="312" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-2-2">3/4</text>
<text x="875" y="312" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-2-3">3/4</text>
<text x="995" y="312" font-size="18" fill="#251f21" font-weight="400" id="adaptive-cell-2-4">1</text>
<text x="58" y="356" font-size="17" fill="#251f21" font-weight="600" >Branch-weighted reveal</text>
<text x="485" y="356" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-3-0">1</text>
<text x="610" y="356" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-3-1">1/2</text>
<text x="745" y="356" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-3-2">1/2</text>
<text x="875" y="356" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-3-3">1</text>
<text x="995" y="356" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-3-4">1</text>
<text x="58" y="400" font-size="17" fill="#251f21" font-weight="600" >Unreachable reveal</text>
<text x="485" y="400" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-4-0">1</text>
<text x="610" y="400" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-4-1">0</text>
<text x="745" y="400" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-4-2">0</text>
<text x="875" y="400" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-4-3">1</text>
<text x="995" y="400" font-size="18" fill="#317e6b" font-weight="600" id="adaptive-cell-4-4">1</text>
<text x="58" y="444" font-size="17" fill="#251f21" font-weight="600" >Shared coin: conditional failure</text>
<text x="485" y="444" font-size="18" fill="#bd2632" font-weight="600" id="adaptive-cell-5-0">3</text>
<text x="610" y="444" font-size="18" fill="#bd2632" font-weight="600" id="adaptive-cell-5-1">1</text>
<text x="745" y="444" font-size="18" fill="#bd2632" font-weight="600" id="adaptive-cell-5-2">1</text>
<text x="875" y="444" font-size="18" fill="#bd2632" font-weight="600" id="adaptive-cell-5-3">1</text>
<text x="995" y="444" font-size="18" fill="#bd2632" font-weight="600" id="adaptive-cell-5-4">1</text>
<text x="48" y="518" font-size="18" fill="#251f21" font-weight="600" >Every row: actual delta &lt;= clipped deficit &lt;= uniform bound &lt;= additive bound.</text>
<text x="48" y="550" font-size="17" fill="#585254" font-weight="400" >T is the product of fixed round factors, not epsilon. Uniform uses all histories, even null ones.</text>
<text x="48" y="596" font-size="21" fill="#251f21" font-weight="600" >2  Weight the branch before charging its conditional failure</text>
<text x="48" y="632" font-size="17" fill="#585254" font-weight="400" >Branch-weighted control: first release is a fair coin, independent of the secret.</text>
<path id="branch-left" d="M 548 673 L 290 747" fill="none" stroke="#317e6b" stroke-width="3"/>
<path id="branch-right" d="M 572 673 L 830 747" fill="none" stroke="#317e6b" stroke-width="3"/>
<text x="520" y="672" font-size="20" fill="#251f21" font-weight="600" >root</text>
<text x="146" y="775" font-size="18" fill="#251f21" font-weight="600" >history [0]: reveal secret</text>
<text x="146" y="810" font-size="17" fill="#585254" font-weight="400" >incoming mass</text>
<text x="354" y="810" font-size="18" fill="#317e6b" font-weight="600" id="branch-value-0-0">1/2</text>
<text x="146" y="842" font-size="17" fill="#585254" font-weight="400" >local delta</text>
<text x="354" y="842" font-size="18" fill="#317e6b" font-weight="600" id="branch-value-0-1">1</text>
<text x="146" y="874" font-size="17" fill="#585254" font-weight="400" >removed mass</text>
<text x="354" y="874" font-size="18" fill="#317e6b" font-weight="600" id="branch-value-0-2">1/2</text>
<text x="686" y="775" font-size="18" fill="#251f21" font-weight="600" >history [1]: constant</text>
<text x="686" y="810" font-size="17" fill="#585254" font-weight="400" >incoming mass</text>
<text x="894" y="810" font-size="18" fill="#317e6b" font-weight="600" id="branch-value-1-0">1/2</text>
<text x="686" y="842" font-size="17" fill="#585254" font-weight="400" >local delta</text>
<text x="894" y="842" font-size="18" fill="#317e6b" font-weight="600" id="branch-value-1-1">0</text>
<text x="686" y="874" font-size="17" fill="#585254" font-weight="400" >removed mass</text>
<text x="894" y="874" font-size="18" fill="#317e6b" font-weight="600" id="branch-value-1-2">0</text>
<text x="48" y="935" font-size="18" fill="#251f21" font-weight="600" >Total removed mass = 1/2, not the worst conditional delta 1 charged to every branch.</text>
<text x="48" y="972" font-size="17" fill="#585254" font-weight="400" >An impossible bad history still gets audited, but has zero incoming mass and zero charge.</text>
<text x="48" y="1006" font-size="17" fill="#585254" font-weight="400" >The shared-coin control instead has deterministic disclosure at reachable conditional nodes.</text>
<line x1="48" y1="1035" x2="1072" y2="1035" stroke="#eae9ea"/>
<text x="48" y="1069" font-size="16" fill="#585254" font-weight="400" >Finite supplied kernels only. No sampler verification, privacy filter, odometer or new composition theorem.</text>
</g></svg>
