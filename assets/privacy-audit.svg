<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1050" viewBox="0 0 1120 1050"><rect width="1120" height="1050" fill="#f4efec"/><rect x="16" y="16" width="1088" height="1018" rx="22" fill="white"/><g font-family="Arial,sans-serif">
<metadata id="full-privacy-report" data-encoding="zlib-base64-json"></metadata>
<text x="48" y="62" font-size="30" fill="#251f21" font-weight="600" >PrivacyLab / private marginals can leak jointly</text>
<text x="48" y="96" font-size="18" fill="#585254" font-weight="400" >Exact rational finite-channel privacy factors, attaining events and randomness assumptions.</text>
<text x="48" y="139" font-size="21" fill="#251f21" font-weight="600" >1  Marginal guarantees are not a license to compose shared coins</text>
<text x="58" y="182" font-size="16" fill="#585254" font-weight="400" >Developed channel</text>
<text x="468" y="182" font-size="16" fill="#585254" font-weight="400" >Pure factor</text>
<text x="655" y="182" font-size="16" fill="#585254" font-weight="400" >delta (t=1)</text>
<text x="805" y="182" font-size="16" fill="#585254" font-weight="400" >delta (t=3)</text>
<text x="955" y="182" font-size="16" fill="#585254" font-weight="400" >delta (t=9)</text>
<text x="58" y="222" font-size="17" fill="#251f21" font-weight="400" >Randomized response</text>
<text x="468" y="222" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-0-0">3</text>
<text x="655" y="222" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-0-1">1/2</text>
<text x="805" y="222" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-0-2">0</text>
<text x="955" y="222" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-0-3">0</text>
<text x="58" y="264" font-size="17" fill="#251f21" font-weight="400" >Two independent releases</text>
<text x="468" y="264" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-1-0">9</text>
<text x="655" y="264" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-1-1">1/2</text>
<text x="805" y="264" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-1-2">3/8</text>
<text x="955" y="264" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-1-3">0</text>
<text x="58" y="306" font-size="17" fill="#251f21" font-weight="400" >Vote + fresh tie-break</text>
<text x="468" y="306" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-2-0">3</text>
<text x="655" y="306" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-2-1">1/2</text>
<text x="805" y="306" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-2-2">0</text>
<text x="955" y="306" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-2-3">0</text>
<text x="58" y="348" font-size="17" fill="#251f21" font-weight="400" >Parity only</text>
<text x="468" y="348" font-size="17" fill="#317e6b" font-weight="600" id="privacy-cell-3-0">1</text>
<text x="655" y="348" font-size="17" fill="#317e6b" font-weight="600" id="privacy-cell-3-1">0</text>
<text x="805" y="348" font-size="17" fill="#317e6b" font-weight="600" id="privacy-cell-3-2">0</text>
<text x="955" y="348" font-size="17" fill="#317e6b" font-weight="600" id="privacy-cell-3-3">0</text>
<text x="58" y="390" font-size="17" fill="#251f21" font-weight="400" >Shared coin: first marginal</text>
<text x="468" y="390" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-4-0">3</text>
<text x="655" y="390" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-4-1">1/2</text>
<text x="805" y="390" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-4-2">0</text>
<text x="955" y="390" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-4-3">0</text>
<text x="58" y="432" font-size="17" fill="#251f21" font-weight="400" >Shared coin: second marginal</text>
<text x="468" y="432" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-5-0">1</text>
<text x="655" y="432" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-5-1">0</text>
<text x="805" y="432" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-5-2">0</text>
<text x="955" y="432" font-size="17" fill="#251f21" font-weight="400" id="privacy-cell-5-3">0</text>
<text x="58" y="474" font-size="17" fill="#251f21" font-weight="600" >Shared coin: joint release</text>
<text x="468" y="474" font-size="17" fill="#bd2632" font-weight="600" id="privacy-cell-6-0">infinite</text>
<text x="655" y="474" font-size="17" fill="#bd2632" font-weight="600" id="privacy-cell-6-1">1</text>
<text x="805" y="474" font-size="17" fill="#bd2632" font-weight="600" id="privacy-cell-6-2">1</text>
<text x="955" y="474" font-size="17" fill="#bd2632" font-weight="600" id="privacy-cell-6-3">1</text>
<text x="48" y="516" font-size="18" fill="#251f21" font-weight="600" >t = exp(epsilon), NOT epsilon. Pure factors 3 and 9 mean epsilon = ln(3) and ln(9).</text>
<text x="48" y="548" font-size="17" fill="#585254" font-weight="400" >delta(t) is the maximum sum of positive P - tQ terms over both neighbor directions.</text>
<text x="48" y="595" font-size="21" fill="#251f21" font-weight="600" >2  A = secret XOR Z, B = Z: the joint release recovers the secret</text>
<text x="58" y="639" font-size="16" fill="#585254" font-weight="400" >Joint output (A, B)</text>
<text x="470" y="639" font-size="17" fill="#251f21" font-weight="600" >00</text>
<text x="620" y="639" font-size="17" fill="#251f21" font-weight="600" >01</text>
<text x="770" y="639" font-size="17" fill="#251f21" font-weight="600" >10</text>
<text x="920" y="639" font-size="17" fill="#251f21" font-weight="600" >11</text>
<text x="58" y="683" font-size="17" fill="#251f21" font-weight="400" >P(output | secret = 0)</text>
<text x="470" y="683" font-size="18" fill="#317e6b" font-weight="600" id="joint-cell-0-0">3/4</text>
<text x="620" y="683" font-size="18" fill="#585254" font-weight="400" id="joint-cell-0-1">0</text>
<text x="770" y="683" font-size="18" fill="#585254" font-weight="400" id="joint-cell-0-2">0</text>
<text x="920" y="683" font-size="18" fill="#317e6b" font-weight="600" id="joint-cell-0-3">1/4</text>
<text x="58" y="728" font-size="17" fill="#251f21" font-weight="400" >P(output | secret = 1)</text>
<text x="470" y="728" font-size="18" fill="#585254" font-weight="400" id="joint-cell-1-0">0</text>
<text x="620" y="728" font-size="18" fill="#317e6b" font-weight="600" id="joint-cell-1-1">1/4</text>
<text x="770" y="728" font-size="18" fill="#317e6b" font-weight="600" id="joint-cell-1-2">3/4</text>
<text x="920" y="728" font-size="18" fill="#585254" font-weight="400" id="joint-cell-1-3">0</text>
<text x="48" y="775" font-size="18" fill="#251f21" font-weight="600" >The rows have disjoint supports. delta(t) = 1 for every finite t.</text>
<text x="48" y="809" font-size="17" fill="#585254" font-weight="400" >Each marginal looks private, but conditioned on A = 0, B is 0 versus 1 deterministically.</text>
<text x="48" y="842" font-size="17" fill="#585254" font-weight="400" >This violates the required conditional-mechanism premise, not a composition theorem.</text>
<text x="48" y="891" font-size="21" fill="#251f21" font-weight="600" >3  Postprocessing may reduce privacy loss, without promising utility</text>
<text x="48" y="927" font-size="17" fill="#585254" font-weight="400" >Fresh tie-breaking returns the original randomized-response channel; parity is secret-independent.</text>
<text x="48" y="958" font-size="17" fill="#585254" font-weight="400" >Certificates concern supplied tables and listed neighbors, not a deployed model or secure sampler.</text>
<line x1="48" y1="981" x2="1072" y2="981" stroke="#eae9ea"/>
<text x="48" y="1009" font-size="15" fill="#585254" font-weight="400" >Reproduce: python examples/render_figure.py --check | full exact event witnesses embedded</text>
</g></svg>
