<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1110" viewBox="0 0 1120 1110"><rect width="1120" height="1110" fill="#f4efec"/><rect x="16" y="16" width="1088" height="1078" rx="22" fill="white"/><g font-family="Arial,sans-serif">
<metadata id="full-frontier-report" data-encoding="zlib-base64-json"></metadata>
<text x="48" y="62" font-size="30" fill="#251f21" font-weight="600" >PrivacyLab / the worst neighbor can change</text>
<text x="48" y="96" font-size="18" fill="#585254" font-weight="400" >Exact all-factor upper envelopes, whole-interval certificates and inverse delta budgets.</text>
<text x="48" y="143" font-size="21" fill="#251f21" font-weight="600" >1  A global breakpoint that no individual likelihood-ratio grid contains</text>
<text x="150" y="201" font-size="17" fill="#585254" font-weight="400" >delta(t)</text>
<text x="600" y="201" font-size="16" fill="#585254" font-weight="400" >gray: directed pair profiles | green: their maximum</text>
<path d="M 150 250 L 150 510 L 1030 510" stroke="#b9b4b6" fill="none"/>
<line x1="150" y1="510.000" x2="1014" y2="510.000" stroke="#ebe7e8"/>
<text x="98" y="515.0" font-size="15" fill="#585254" font-weight="400" >0</text>
<line x1="150" y1="414.000" x2="1014" y2="414.000" stroke="#ebe7e8"/>
<text x="98" y="419.0" font-size="15" fill="#585254" font-weight="400" >1/8</text>
<line x1="150" y1="318.000" x2="1014" y2="318.000" stroke="#ebe7e8"/>
<text x="98" y="323.0" font-size="15" fill="#585254" font-weight="400" >1/4</text>
<line x1="150" y1="270.000" x2="1014" y2="270.000" stroke="#ebe7e8"/>
<text x="98" y="275.0" font-size="15" fill="#585254" font-weight="400" >5/16</text>
<polyline id="directed-curve-0" points="150.000,270.000 366.000,510.000 1014.000,510.000" fill="none" stroke="#b9b4b6" stroke-width="2"/>
<polyline id="directed-curve-1" points="150.000,270.000 193.200,327.600 1014.000,510.000" fill="none" stroke="#b9b4b6" stroke-width="2"/>
<polyline id="directed-curve-2" points="150.000,318.000 193.200,385.200 474.000,510.000 1014.000,510.000" fill="none" stroke="#b9b4b6" stroke-width="2"/>
<polyline id="directed-curve-3" points="150.000,318.000 258.000,438.000 582.000,510.000 1014.000,510.000" fill="none" stroke="#b9b4b6" stroke-width="2"/>
<polyline id="global-frontier" points="150.000,270.000 204.000,330.000 1014.000,510.000" fill="none" stroke="#317e6b" stroke-width="5"/>
<circle id="frontier-knot-0" cx="150.000" cy="270.000" r="5" fill="#317e6b"/>
<circle id="frontier-knot-1" cx="204.000" cy="330.000" r="5" fill="#317e6b"/>
<circle id="frontier-knot-2" cx="1014.000" cy="510.000" r="5" fill="#317e6b"/>
<text x="140.0" y="539" font-size="15" fill="#585254" font-weight="400" >1</text>
<text x="194.0" y="539" font-size="15" fill="#585254" font-weight="400" >5/4</text>
<text x="356.0" y="539" font-size="15" fill="#585254" font-weight="400" >2</text>
<text x="572.0" y="539" font-size="15" fill="#585254" font-weight="400" >3</text>
<text x="1004.0" y="539" font-size="15" fill="#585254" font-weight="400" >5</text>
<text x="1034" y="539" font-size="16" fill="#585254" font-weight="400" >t</text>
<text x="247" y="288" font-size="18" fill="#317e6b" font-weight="600" >pair 0 -&gt; pair 1 at t = 5/4</text>
<text x="48" y="580" font-size="18" fill="#251f21" font-weight="600" >delta = 5/8 - 5t/16 on [1,5/4]; then 5/16 - t/16 on [5/4,5]; then zero.</text>
<text x="48" y="613" font-size="17" fill="#585254" font-weight="400" >5/4 is absent from the ratio grid {1, 6/5, 3/2, 2, 5/2, 3, 5}. Cross-pair envelopes matter.</text>
<text x="48" y="659" font-size="21" fill="#251f21" font-weight="600" >2  The smallest factor meeting a target delta, or an exact obstruction</text>
<text x="58" y="702" font-size="16" fill="#585254" font-weight="400" >Developed query</text>
<text x="360" y="702" font-size="16" fill="#585254" font-weight="400" >Minimum factor</text>
<text x="730" y="702" font-size="16" fill="#585254" font-weight="400" >Certificate</text>
<text x="58" y="744" font-size="17" fill="#251f21" font-weight="400" id="frontier-query-0-0">Envelope delta 0</text>
<text x="360" y="744" font-size="17" fill="#317e6b" font-weight="600" id="frontier-query-0-1">5</text>
<text x="730" y="744" font-size="16" fill="#585254" font-weight="400" >positive left-slope root</text>
<text x="58" y="786" font-size="17" fill="#251f21" font-weight="400" id="frontier-query-1-0">Envelope delta 15/64</text>
<text x="360" y="786" font-size="17" fill="#317e6b" font-weight="600" id="frontier-query-1-1">5/4</text>
<text x="730" y="786" font-size="16" fill="#585254" font-weight="400" >positive left-slope root</text>
<text x="58" y="828" font-size="17" fill="#251f21" font-weight="400" id="frontier-query-2-0">Envelope delta 1/4</text>
<text x="360" y="828" font-size="17" fill="#317e6b" font-weight="600" id="frontier-query-2-1">6/5</text>
<text x="730" y="828" font-size="16" fill="#585254" font-weight="400" >positive left-slope root</text>
<text x="58" y="870" font-size="17" fill="#251f21" font-weight="400" id="frontier-query-3-0">Singular delta 1/4</text>
<text x="360" y="870" font-size="17" fill="#bd2632" font-weight="600" id="frontier-query-3-1">unattainable</text>
<text x="730" y="870" font-size="16" fill="#585254" font-weight="400" >singular mass = 1/2</text>
<text x="58" y="912" font-size="17" fill="#251f21" font-weight="400" id="frontier-query-4-0">Large-factor delta 0</text>
<text x="360" y="912" font-size="17" fill="#317e6b" font-weight="600" id="frontier-query-4-1">500000000000000000000000000000</text>
<text x="730" y="912" font-size="16" fill="#585254" font-weight="400" >outside point-audit domain</text>
<text x="48" y="988" font-size="17" fill="#585254" font-weight="400" >Each affine piece dominates every local piece over its whole interval, including the infinite tail.</text>
<text x="48" y="1021" font-size="17" fill="#585254" font-weight="400" >All factors are multiplicative t = exp(epsilon), not epsilon. No new privacy theorem is claimed.</text>
<line x1="48" y1="1042" x2="1072" y2="1042" stroke="#eae9ea"/>
<text x="48" y="1073" font-size="16" fill="#585254" font-weight="400" >Small supplied finite tables only: at most 4 secrets / 8 outputs. Not a sampler, model or production accountant.</text>
</g></svg>
