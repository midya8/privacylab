name: PrivacyLab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m privacylab demo > /tmp/demo.json
          cmp /tmp/demo.json examples/demo.json
          python -m privacylab audit examples/input.json > /tmp/input.json
          python examples/render_figure.py --check
          python -m privacylab adaptive-demo > /tmp/adaptive-demo.json
          cmp /tmp/adaptive-demo.json examples/adaptive-demo.json
          python -m privacylab adaptive examples/adaptive-input.json > /tmp/adaptive-input.json
          python examples/render_adaptive.py --check
          python -m privacylab frontier-demo > /tmp/frontier-demo.json
          cmp /tmp/frontier-demo.json examples/frontier-demo.json
          python -m privacylab frontier examples/frontier-input.json > /tmp/frontier-input.json
          python examples/render_frontier.py --check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps . -w /tmp/wheels
      - run: |
          python -m privacylab demo > /tmp/source-demo.json
          python -m privacylab audit examples/input.json > /tmp/source-input.json
          python -m privacylab adaptive-demo > /tmp/source-adaptive-demo.json
          python -m privacylab adaptive examples/adaptive-input.json > /tmp/source-adaptive-input.json
          python -m privacylab frontier-demo > /tmp/source-frontier-demo.json
          python -m privacylab frontier examples/frontier-input.json > /tmp/source-frontier-input.json
          python -m pip install --no-deps --target /tmp/installed /tmp/wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/installed python -m privacylab demo > /tmp/wheel-demo.json
          PYTHONPATH=/tmp/installed python -m privacylab audit "$GITHUB_WORKSPACE/examples/input.json" > /tmp/wheel-input.json
          PYTHONPATH=/tmp/installed python -m privacylab adaptive-demo > /tmp/wheel-adaptive-demo.json
          PYTHONPATH=/tmp/installed python -m privacylab adaptive "$GITHUB_WORKSPACE/examples/adaptive-input.json" > /tmp/wheel-adaptive-input.json
          PYTHONPATH=/tmp/installed python -m privacylab frontier-demo > /tmp/wheel-frontier-demo.json
          PYTHONPATH=/tmp/installed python -m privacylab frontier "$GITHUB_WORKSPACE/examples/frontier-input.json" > /tmp/wheel-frontier-input.json
          cmp /tmp/source-frontier-demo.json /tmp/wheel-frontier-demo.json
          cmp /tmp/source-frontier-input.json /tmp/wheel-frontier-input.json
          cmp /tmp/source-adaptive-demo.json /tmp/wheel-adaptive-demo.json
          cmp /tmp/source-adaptive-input.json /tmp/wheel-adaptive-input.json
          cmp /tmp/source-demo.json /tmp/wheel-demo.json
          cmp /tmp/source-input.json /tmp/wheel-input.json
